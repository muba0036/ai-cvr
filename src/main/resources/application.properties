spring.application.name=praktik-ansoegning
server.port=8081

# Lokal fil-database til cache af virksomhedsopslag (kun firmadata, ingen persondata)
spring.datasource.url=jdbc:h2:file:./data/cache;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# CVR-API (cvrapi.dk). User-Agent skal beskrive projektet jf. deres vilkår.
cvr.base-url=https://cvrapi.dk/api
cvr.user-agent=Skoleprojekt praktik-ansoegning
# Hvor længe et cachet opslag er gyldigt
cvr.cache-ttl=7d
# Vores egen grænse pr. døgn - holder os under API'ets kvote
cvr.daily-limit=50

# OpenAI (API-nøgle læses fra miljøvariablen OPENAI_API_KEY)
ai.base-url=https://api.openai.com/v1
ai.model=gpt-4o-mini

# H2-konsol til at se databasen i browseren: http://localhost:8081/h2-console
spring.h2.console.enabled=true
